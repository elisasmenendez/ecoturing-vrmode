<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=no"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="stylesheet" href="css/common.css" />
    <title>360 + Gaze Toggle (WebXR Polyfill)</title>
  </head>

  <body>
    <header>
      <details open>
        <summary>360 + Gaze Toggle (WebXR Polyfill)</summary>
        <p>
          Olhe para o hotspot (no centro, à frente) por ~1s para alternar Cantagalo ⇄ Peixe.
          <a class="back" href="./">Back</a>
        </p>
      </details>
    </header>

    <main style="text-align: center">
      <p>Clique 'Enter XR' para ver o conteúdo</p>
      <p><small>Dica iPhone: sirva em HTTPS (ou localhost) para sensores.</small></p>
    </main>

    <script type="module">
      import { WebXRButton } from "./js/util/webxr-button.js";
      import { Scene } from "./js/render/scenes/scene.js";
      import { Renderer, createWebGLContext } from "./js/render/core/renderer.js";
      import { SkyboxNode } from "./js/render/nodes/skybox.js";
      import { QueryArgs } from "./js/util/query-args.js";

      // Polyfill (como no sample)
      import WebXRPolyfill from "./js/third-party/webxr-polyfill/build/webxr-polyfill.module.js";
      if (QueryArgs.getBool("usePolyfill", true)) {
        new WebXRPolyfill();
      }

      // XR globals.
      let xrButton = null;
      let xrRefSpace = null;

      // WebGL globals.
      let gl = null;
      let renderer = null;

      // -------------- CENA --------------
      let scene = new Scene();

      // Seus panoramas (ajuste paths conforme seu repo)
      const panoramas = [
        { url: "Cantagalo.JPG", label: "Cantagalo" },
        { url: "Peixe.JPG", label: "Peixe" },
      ];

      let current = 0;
      let skybox = null;

      function buildSkybox(url) {
        // SkyboxNode no webxr-samples costuma aceitar uma imagem equiretangular.
        // Se a sua versão exigir outro formato, me diga que eu adapto.
        return new SkyboxNode({ url });
      }

      function setPanorama(index) {
        current = index;

        // Remove skybox antigo e adiciona novo (forma mais robusta)
        if (skybox && scene.removeNode) scene.removeNode(skybox);
        // Se sua Scene não tiver removeNode, a alternativa é recriar Scene (mais pesado).
        skybox = buildSkybox(panoramas[current].url);
        scene.addNode(skybox);

        // Atualiza texto na página (debug)
        const p = document.querySelector("main p");
        if (p) p.textContent = `Panorama atual: ${panoramas[current].label} (olhe 1s para trocar)`;
      }

      // Inicializa com Cantagalo
      setPanorama(0);

      // -------------- GAZE / FUSE --------------
      // Um “hotspot” fixo no mundo (à frente do ponto inicial).
      // Você precisa olhar para ele por ~1s para trocar.
      const hotspotWorldPos = { x: 0, y: 1.6, z: -2.0 };

      // Parâmetros do gaze
      const GAZE_THRESHOLD_DOT = Math.cos((12 * Math.PI) / 180); // ~12 graus
      const FUSE_MS = 900;

      let gazeStart = null;
      let lastToggleAt = 0;
      const COOLDOWN_MS = 600;

      function getForwardFromQuaternion(q) {
        // Forward no WebXR geralmente é -Z no espaço do viewer.
        // Converte quaternion -> vetor forward (0,0,-1) rotacionado por q.
        const x = q.x, y = q.y, z = q.z, w = q.w;
        // rotacionar v=(0,0,-1)
        // fórmula otimizada:
        const fx = -2 * (x * z + w * y);
        const fy = -2 * (y * z - w * x);
        const fz = -1 + 2 * (x * x + y * y);
        return { x: fx, y: fy, z: fz };
      }

      function dot(a, b) {
        return a.x * b.x + a.y * b.y + a.z * b.z;
      }

      function normalize(v) {
        const len = Math.hypot(v.x, v.y, v.z) || 1;
        return { x: v.x / len, y: v.y / len, z: v.z / len };
      }

      function sub(a, b) {
        return { x: a.x - b.x, y: a.y - b.y, z: a.z - b.z };
      }

      function initXR() {
        xrButton = new WebXRButton({
          onRequestSession,
          onEndSession,
        });
        document.querySelector("header").appendChild(xrButton.domElement);

        if (navigator.xr) {
          navigator.xr.isSessionSupported("immersive-vr").then((supported) => {
            xrButton.enabled = supported;
          });
        }
      }

      function onRequestSession() {
        return navigator.xr.requestSession("immersive-vr").then(onSessionStarted);
      }

      function onSessionStarted(session) {
        xrButton.setSession(session);
        session.addEventListener("end", onSessionEnded);

        gl = createWebGLContext({ xrCompatible: true });
        renderer = new Renderer(gl);
        scene.setRenderer(renderer);

        session.updateRenderState({ baseLayer: new XRWebGLLayer(session, gl) });

        session.requestReferenceSpace("local").then((refSpace) => {
          xrRefSpace = refSpace;
          session.requestAnimationFrame(onXRFrame);
        });
      }

      function onEndSession(session) {
        session.end();
      }

      function onSessionEnded() {
        xrButton.setSession(null);
        renderer = null;
      }

      function onXRFrame(t, frame) {
        const session = frame.session;
        session.requestAnimationFrame(onXRFrame);

        scene.startFrame();

        const pose = frame.getViewerPose(xrRefSpace);
        if (pose) {
          const glLayer = session.renderState.baseLayer;
          gl.bindFramebuffer(gl.FRAMEBUFFER, glLayer.framebuffer);
          gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

          // --- GAZE CHECK: usa a 1ª view (já serve para fuse) ---
          // Pega posição e orientação do viewer
          const view0 = pose.views[0];
          const viewerPos = view0.transform.position;
          const viewerOri = view0.transform.orientation;

          const forward = normalize(getForwardFromQuaternion(viewerOri));
          const toHotspot = normalize(
            sub(hotspotWorldPos, { x: viewerPos.x, y: viewerPos.y, z: viewerPos.z })
          );

          const d = dot(forward, toHotspot);
          const now = performance.now();

          const gazing = d >= GAZE_THRESHOLD_DOT;

          if (gazing) {
            if (gazeStart == null) gazeStart = now;

            const elapsed = now - gazeStart;
            const cooldownOk = now - lastToggleAt > COOLDOWN_MS;

            if (elapsed >= FUSE_MS && cooldownOk) {
              // alterna panorama
              const next = (current + 1) % panoramas.length;
              setPanorama(next);
              lastToggleAt = now;
              gazeStart = null; // reseta
            }
          } else {
            gazeStart = null;
          }

          // Render normal do skybox para cada view
          for (const view of pose.views) {
            const viewport = glLayer.getViewport(view);
            gl.viewport(viewport.x, viewport.y, viewport.width, viewport.height);
            scene.draw(view.projectionMatrix, view.transform);
          }
        }

        scene.endFrame();
      }

      initXR();
    </script>
  </body>
</html>
