<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Visualização 360°</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; }
    </style>
  </head>
  <body>
    <a-scene vr-mode-ui="enabled: true">
      <a-assets>
        <img id="panorama1" src="Poco_Urubu.jpg" crossorigin="anonymous">
        <img id="panorama2" src="Ze_Pezao_2.jpg" crossorigin="anonymous">
        <img id="panorama3" src="Cantagalo.JPG" crossorigin="anonymous">
      </a-assets>

      <a-sky id="sky" src="#panorama1" rotation="0 -90 0"></a-sky>

      <a-camera position="0 1.6 0" wasd-controls-enabled="false" look-controls="true">
        <a-cursor
          fuse="true"
          fuseTimeout="1200"
          raycaster="objects: .clickable"
          geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.016"
          material="shader: flat; color: white">
        </a-cursor>

        <!-- Barra de progresso do gaze -->
        <a-entity
          id="progressRing"
          geometry="primitive: ring; radiusInner: 0.018; radiusOuter: 0.022"
          material="shader: flat; color: #00FFAA; opacity: 0.9"
          scale="0 0 0"
          position="0 0 -0.001"
          animation__start="property: scale; to: 1 1 1; dur: 1200; startEvents: mouseenter"
          animation__reset="property: scale; to: 0 0 0; dur: 0; startEvents: mouseleave">
        </a-entity>

        <a-entity position="0 -0.35 -1.1">
          <a-plane
            id="btnToggle"
            class="clickable"
            width="0.85"
            height="0.24"
            color="#111"
            opacity="0.75"
            material="shader: flat">
          </a-plane>

          <a-text
            value="Olhe para trocar imagem"
            align="center"
            color="#fff"
            width="2.4"
            position="0 0.03 0.01">
          </a-text>

          <a-text
            id="statusText"
            value="Atual: Poco Urubu"
            align="center"
            color="#ddd"
            width="2.2"
            position="0 -0.12 0.01"
            scale="0.85 0.85 0.85">
          </a-text>
        </a-entity>
      </a-camera>
    </a-scene>

    <script>
      const sky = document.getElementById("sky");
      const btn = document.getElementById("btnToggle");
      const statusText = document.getElementById("statusText");
      const progressRing = document.getElementById("progressRing");

      const panoramas = [
        { src: "#panorama1", label: "Poco Urubu" },
        { src: "#panorama2", label: "Ze Pezao 2" },
        { src: "#panorama3", label: "Cantagalo" }
      ];

      let current = 0;

      function setPanorama(index) {
        current = index;
        sky.setAttribute("src", panoramas[current].src);
        statusText.setAttribute("value", `Atual: ${panoramas[current].label}`);
      }

      btn.addEventListener("click", () => {
        const next = (current + 1) % panoramas.length;
        setPanorama(next);
      });

      btn.addEventListener("mouseenter", () => {
        btn.setAttribute("opacity", "0.95");
      });

      btn.addEventListener("mouseleave", () => {
        btn.setAttribute("opacity", "0.75");
      });

      btn.addEventListener("mouseenter", () => {
        progressRing.emit("mouseenter");
      });

      btn.addEventListener("mouseleave", () => {
        progressRing.emit("mouseleave");
      });
    </script>
  </body>
</html>
